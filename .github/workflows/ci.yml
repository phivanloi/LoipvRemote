name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"

      - name: Restore solution
        run: dotnet restore LoipvRemote.slnx

      - name: Build solution
        run: dotnet build LoipvRemote.slnx -c Release -p:Platform=x64 --no-restore --nologo

  build-installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
          - runner: windows-11-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"

      - name: Restore solution dependencies
        run: dotnet restore LoipvRemote.slnx

      - name: Restore installer dependencies
        run: dotnet restore LoipvRemoteInstaller/Installer/Installer.wixproj

      - name: Build installer
        run: dotnet build LoipvRemoteInstaller/Installer/Installer.wixproj -c Release -p:Platform=${{ matrix.platform }} --no-restore --nologo

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: loipvremote-installer-${{ matrix.platform }}
          path: LoipvRemoteInstaller/Installer/bin/${{ matrix.platform }}/Release/*.msi
          if-no-files-found: error
