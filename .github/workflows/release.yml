name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
          - runner: windows-11-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.402"

      - name: Restore solution dependencies
        run: dotnet restore LoipvRemote.slnx -p:Platform=${{ matrix.platform }}

      - name: Restore installer dependencies
        run: dotnet restore LoipvRemoteInstaller/Installer/Installer.wixproj -p:Platform=${{ matrix.platform }}

      - name: Build installer
        run: dotnet build LoipvRemoteInstaller/Installer/Installer.wixproj -c Release -p:Platform=${{ matrix.platform }} --no-restore --nologo

      - name: Package portable application
        shell: pwsh
        run: |
          $payload = "LoipvRemoteInstaller\Installer\obj\${{ matrix.platform }}\Release\payload"
          $portable = "LoipvRemoteInstaller\Installer\bin\${{ matrix.platform }}\Release\LoipvRemote-Portable-${{ matrix.platform }}.zip"
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $portable -CompressionLevel Optimal -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: loipvremote-installer-${{ matrix.platform }}
          path: |
            LoipvRemoteInstaller/Installer/bin/${{ matrix.platform }}/Release/*.msi
            LoipvRemoteInstaller/Installer/bin/${{ matrix.platform }}/Release/*.zip
          if-no-files-found: error

  publish-release:
    needs: build-installer
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: loipvremote-installer-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
